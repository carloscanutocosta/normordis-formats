name: Conformance Suite

on:
  push:
    branches: ["devel", "master", "main"]
  pull_request:

jobs:
  conformance-python:
    name: Python conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: NDF / NDT / NCRTF suites
        run: python3 tools/validate.py

      - name: Package integrity (ndfpkg-example)
        run: python3 tools/validate.py --package specs/ndf/examples/ndfpkg-example

      - name: Package negative vectors
        run: python3 tools/check_package_vectors.py

      - name: Conjunto de transferência — exemplo (must pass)
        run: |
          python3 tools/build_ndfxfer_example.py
          python3 tools/check_transferencia.py specs/ndf/examples/ndfxfer-example

      - name: Conjunto de transferência — vetores negativos
        run: python3 tools/check_transferencia_vectors.py

      - name: NDT semantic corpus
        run: python3 tools/check_ndt_semantic_corpus.py

      - name: Normative requirements and language audit
        run: |
          python3 tools/build_requirements_index.py
          git diff --exit-code docs/normalization/REQUIREMENTS.md
          python3 tools/audit_normative.py
          git diff --exit-code docs/normalization/NORMATIVE-STATEMENTS.md
          python3 tools/check_publication_profile.py

      - name: SPEC/schema coherence guardrails
        run: python3 tools/check_spec_coherence.py

      - name: Conformance index up to date
        run: |
          python3 tools/build_conformance_index.py
          git diff --exit-code conformance/INDEX.md

      - name: Build public-review dossier
        run: python3 tools/build_review_bundle.py

      - name: JCS vectors — Python
        run: python3 tools/check_jcs_vectors.py

      - name: Custody chain — valid (must pass)
        run: python3 tools/check_custody.py conformance/custody/valid-chain.json

      - name: Custody chain — invalid (must reject)
        run: "! python3 tools/check_custody.py conformance/custody/invalid-chain.json"

      - name: Custody chain — captura (must pass)
        run: python3 tools/check_custody.py conformance/custody/captura-chain.json

      - name: Custody chain — cadeia do recetor (must pass)
        run: python3 tools/check_custody.py conformance/custody/cadeia-do-recetor.json

      - name: Custody chain — omissão recomposta (must reject)
        run: "! python3 tools/check_custody.py conformance/custody/omissao-recomposta.json"

  conformance-js:
    name: JavaScript conformance (cross-language)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: JCS vectors — Node.js
        run: node tools/check-jcs-vectors.mjs

      - name: Custody chain — valid (must pass)
        run: node tools/check-custody.mjs conformance/custody/valid-chain.json

      - name: Custody chain — invalid (must reject)
        run: "! node tools/check-custody.mjs conformance/custody/invalid-chain.json"

  json-lint:
    name: JSON well-formedness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate all JSON files parse correctly
        run: |
          python3 - <<'EOF'
          import json, sys
          from pathlib import Path
          failed = []
          files = sorted(Path(".").rglob("*.json"))
          for p in files:
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except json.JSONDecodeError as e:
                  print(f"FAIL  {p}: {e}")
                  failed.append(str(p))
          if failed:
              sys.exit(1)
          print(f"OK — {len(files)} JSON files well-formed")
          EOF
